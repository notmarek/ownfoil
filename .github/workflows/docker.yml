name: Publish multi arch Docker image

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    tags:
      - '*.*.*'

jobs:
  push_to_registry:
    name: Push Docker image to GitHub Container Registry
    if: startsWith(github.ref, 'refs/tags/') || (!startsWith(github.ref, 'refs/heads/master') && !startsWith(github.ref, 'refs/heads/dependabot') && !startsWith(github.event.head_commit.message, 'ci') && !startsWith(github.event.head_commit.message, 'doc'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # Get the repository's code
      - name: Checkout
        uses: actions/checkout@v7
        # with:
        #   submodules: recursive

      # https://github.com/docker/setup-qemu-action
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A patch of an older release line must not take latest or the major tag back
      - name: Check if the tag is the newest release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          newest=$(git ls-remote --tags --refs origin | sed 's#.*refs/tags/##' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          echo "IS_NEWEST=$([ "$GITHUB_REF_NAME" = "$newest" ] && echo true || echo false)" >> $GITHUB_ENV

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ env.IS_NEWEST == 'true' }}
            type=ref,event=branch,enable=${{ github.ref != 'refs/heads/master' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ env.IS_NEWEST == 'true' }}

      - name: Set platforms based on branch or tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "PLATFORMS=linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v6" >> $GITHUB_ENV
          else
            echo "PLATFORMS=linux/amd64,linux/arm64" >> $GITHUB_ENV
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
